# Federico Malservigi: a personal card site. English here, Italian in site.it.yaml (same section ids).
# Tone: plain and modest; facts, no slogans.
name: Federico Malservigi
description: "Information Science for Management student at the University of Bologna."
lang: en
translations:
  - { lang: it, file: site.it.yaml }
views:   # more pages beside this one, in the same theme
  - { slug: projects, file: projects.yaml, nav_label: Projects, nav_after: percorso, translations: { it: projects.it.yaml } }
theme:   # paper, in the colours and type of Scroll Studio's Wunderkammer example
  preset: paper
  colors: { bg: "#ece4d3", bg2: "#e2d8c4", accent: "#8a2d1b", accent2: "#a8452c" }
  fonts: { display: "Cormorant Garamond", body: "Figtree" }
css: style.css   # Horadric touches on the paper theme: a drop cap, gold ornaments, the roots behind the page
nav:
  cta: { label: Get in touch, href: "#contatti" }
sections:
  - id: inizio
    type: hero   # name and one paragraph on paper; the page's roots start here (style.css, tools/radici.py)
    align: left
    badge: Bologna
    title: Federico <em>Malservigi</em>
    body: "I study Information Science for Management at the University of Bologna. My main focus is data: from February to May 2026 I was a data analyst intern at Bitbang, in the Data Science team, working with Python, Pandas and SQL. I also write Android apps in Kotlin and projects in Java, JavaScript and PHP, often in a team with fellow students."
    buttons:
      - { label: Email me, href: "#contatti" }
      - { label: Projects, href: "#progetti" }

  - id: chi-sono
    type: product
    nav_label: About
    side: left
    image: { file: inputs/montagna.webp, crop: [0.005, 0.004, 0.994, 1.0] }   # trims the screenshot's dark edges
    frame: true
    kicker: About me
    title: Hi, I'm <em>Federico.</em>
    body: "I'm from Bologna and I study Information Science for Management at the University of Bologna. I learn mostly by doing: exam projects in a team and a few apps of my own. Away from university I fence, train in Krav Maga and, when I can, head to the mountains."
    tags: [Italian · native, English · B2, Spanish · A2, Driving licence B]
    buttons:
      - { label: Email me, href: "mailto:malserfede@gmail.com" }
      - { label: LinkedIn, href: "https://www.linkedin.com/in/federico-malservigi" }

  - id: percorso
    type: timeline
    nav_label: Path
    kicker: Path
    title: Education <em>and work</em>
    items:
      - { when: 2018 – 2023, title: Liceo Scientifico E. Fermi, body: "High school diploma (science track), in Bologna." }
      - { when: 2023 – now, title: Information Science for Management, body: "University of Bologna: programming, databases, systems, statistics and project management." }
      - { when: Feb – May 2026, title: Data analyst · Bitbang, body: "Internship in the Data Science team: analysing an e-commerce shop's sales data." }

  - id: progetti   # one card per project; each opens its panel on the projects page
    type: features
    kicker: Projects
    title: What I've <em>built</em>
    items:
      - { tag: Windows · Python, title: Daycast, body: "A weather forecast for your PC time: how long you'll use it today, hour by hour, and which apps you'll open.", href: "projects.html#daycast" }
      - { tag: Android · Kotlin, title: Canone, body: "A music player that analyses every song on the phone and turns it into animated visualisations.", href: "projects.html#canone" }

  - id: github
    type: features
    kicker: More projects
    title: The rest is <em>on GitHub</em>
    items:
      - tag: Personal
        avatar: inputs/imperius-avatar.jpg   # the GitHub profile picture
        title: Fede046
        body: "My projects and the course notes I have shared. The avatar is Imperius, from Diablo III: I grew up with it."
        href: https://github.com/Fede046
      - tag: Study group
        title: E1-Unibo
        body: Exam projects built in a team with fellow students.
        href: https://github.com/E1-Unibo

  - id: competenze
    type: features
    nav_label: Skills
    kicker: Skills
    title: What I <em>use</em>
    items:
      - { tag: Data, title: Analysis, body: "Python with Pandas and NumPy, SQL, MySQL and MongoDB." }
      - { tag: Development, title: Apps and web, body: "Kotlin, Java, JavaScript, HTML and CSS, PHP, GWT. REST APIs with OpenAPI." }
      - { tag: Method, title: Tools, body: "Git, GitHub and GitLab, Docker, Maven. Agile and Scrum. XML, JSON and YAML." }

  - id: fuori
    type: features
    kicker: Away from the screen
    title: Sport, scouting <em>and volunteering</em>
    items:
      - { tag: Since 2017, title: Fencing and Krav Maga, body: "Fencing since 2017, with a third place at the 2019 regional tournament. Now also a traditional Krav Maga course in Bologna." }
      - { tag: 2012 – 2023, title: AGESCI scouts, body: "In the Bologna 18 group from age 8 to the end of high school: trekking, climbing, cycling and the association's service work." }
      - { tag: Volunteering, title: Caritas and AVIS, body: "With Caritas I packed and delivered groceries to families in need. I'm an AVIS blood donor." }
      - { tag: Interests, title: Personal finance, body: "I follow ETFs and bonds and try to understand the numbers behind a portfolio." }

  - id: contatti
    type: cta
    nav_label: Contact
    kicker: Contact
    title: Write to me, <em>I'm happy to reply.</em>
    buttons:
      - { label: malserfede@gmail.com, href: "mailto:malserfede@gmail.com" }
      - { label: LinkedIn, href: "https://www.linkedin.com/in/federico-malservigi" }
      - { label: Telegram, href: "https://t.me/Federico569" }

footer:
  left: © 2026 Federico Malservigi · Bologna
